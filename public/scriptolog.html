<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Скриптолог SlimWay</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--brand:#02BDB6;--accent:#263CD9;--red:#ef4444;--yellow:#f59e0b;--green:#22c55e;--gray:#94a3b8;
  --bg:#eef2f7;--glass:rgba(255,255,255,0.6);--border:rgba(255,255,255,0.7);--shadow:0 2px 16px rgba(2,49,100,0.08)}
html,body{height:100%;font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:#1a202c;font-size:14px}
body{overflow-x:hidden}
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none;z-index:0}
.b1{width:400px;height:400px;background:var(--brand);top:-150px;right:-100px}
.b2{width:350px;height:350px;background:var(--accent);bottom:-100px;left:-80px}

/* ── Login ───────────────────────────────────── */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.screen.hidden{display:none!important}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--border);
  border-radius:20px;box-shadow:var(--shadow);padding:32px 28px;width:300px;text-align:center}
.card .logo{width:44px;height:44px;margin:0 auto 12px;border-radius:12px;
  background:linear-gradient(135deg,var(--brand),var(--accent));
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.card h1{font-size:20px;font-weight:700;margin-bottom:4px}
.card .sub{font-size:12px;color:#64748b;margin-bottom:22px}
input[type=text],input[type=password],input[type=tel]{width:100%;padding:10px 12px;margin-bottom:10px;
  border:1.5px solid var(--border);border-radius:10px;background:rgba(255,255,255,0.8);
  font-size:14px;font-family:inherit;outline:none;color:#1a202c;transition:border-color .15s}
input:focus{border-color:var(--brand)}
.btn{width:100%;padding:11px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),var(--accent));
  color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{margin-top:10px;font-size:12px;color:var(--red);min-height:18px}

/* ── App shell ───────────────────────────────── */
#app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1;overflow:hidden}
#app.hidden{display:none!important}

/* ── Status bar ──────────────────────────────── */
#status-bar{padding:5px 10px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,0.5);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap}
#status-dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex-shrink:0}
#status-dot.ok{background:var(--green)}
#status-dot.warn{background:var(--yellow)}
.toggle-row{display:flex;gap:2px;margin-left:auto}
.lang-btn,.gnd-btn{padding:2px 7px;border:1px solid var(--border);border-radius:6px;font-size:11px;
  font-weight:700;font-family:inherit;cursor:pointer;background:rgba(255,255,255,0.7);color:#64748b;transition:all .12s}
.lang-btn.active,.gnd-btn.active{background:rgba(2,189,182,0.12);border-color:rgba(2,189,182,0.4);color:var(--brand)}
.icon-btn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.6;transition:opacity .15s}
.icon-btn:hover{opacity:1}

/* ── Client card ─────────────────────────────── */
#client-card{background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  padding:8px 12px;flex-shrink:0}
#cc-row1{display:flex;align-items:center;gap:6px;margin-bottom:3px}
#cc-name{font-size:13px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;padding:2px 7px;border-radius:12px;font-size:11px;font-weight:600;white-space:nowrap}
.chip-blue{background:rgba(2,189,182,0.12);color:var(--brand)}
.chip-gray{background:#f1f5f9;color:#64748b}
.chip-yellow{background:rgba(245,158,11,0.12);color:var(--yellow)}
.chip-green{background:rgba(34,197,94,0.12);color:var(--green)}
.chip-red{background:rgba(239,68,68,0.12);color:var(--red)}
#cc-phone-row{display:flex;align-items:center;gap:6px;margin-bottom:3px;font-size:11px;color:#64748b}
#cc-facts{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px}
#cc-mgr-row{font-size:11px;color:#94a3b8;display:flex;align-items:center;gap:4px}
.small-btn{padding:3px 8px;font-size:11px;border:1.5px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,0.7);cursor:pointer;font-family:inherit;font-weight:600;transition:background .15s}
.small-btn:hover{background:rgba(2,189,182,0.08)}
.small-btn.brand{border-color:rgba(2,189,182,0.4);color:var(--brand)}

/* ── Main scroll area ────────────────────────── */
#main-area{flex:1;overflow-y:auto;padding:8px}

/* ── No client ───────────────────────────────── */
.info-msg{text-align:center;color:#94a3b8;font-size:13px;padding:32px 16px;line-height:1.5}

/* ── KZ banner ───────────────────────────────── */
.kz-banner{background:rgba(2,189,182,0.08);border:1px solid rgba(2,189,182,0.25);border-radius:10px;
  padding:6px 10px;font-size:12px;color:#0f766e;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kz-orig{font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.45;border-top:1px dashed rgba(148,163,184,0.3);padding-top:5px}

/* ── Accordion ───────────────────────────────── */
.stage-item{background:var(--glass);backdrop-filter:blur(10px);border:1px solid var(--border);
  border-radius:14px;margin-bottom:6px;overflow:hidden;box-shadow:0 1px 8px rgba(2,49,100,0.05)}
.stage-header{width:100%;display:flex;align-items:center;gap:7px;padding:9px 12px;
  background:none;border:none;cursor:pointer;font-family:inherit;text-align:left;
  transition:background .12s}
.stage-header:hover{background:rgba(2,189,182,0.04)}
.stage-num{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--accent));
  color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stage-item.done .stage-num{background:#22c55e}
.stage-title{font-size:13px;font-weight:700;color:#1a202c;flex:1}
.stage-check{font-size:14px;flex-shrink:0}
.stage-summary{font-size:11px;color:#64748b;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage-chevron{font-size:11px;color:#94a3b8;flex-shrink:0;transition:transform .2s}
.stage-item.open .stage-chevron{transform:rotate(180deg)}
.stage-body{display:none;padding:0 10px 10px}
.stage-item.open .stage-body{display:block}

/* ── Step card ───────────────────────────────── */
.step-card{background:rgba(255,255,255,0.45);border:1px solid var(--border);border-radius:11px;
  padding:10px;margin-bottom:8px}
.step-card.hidden{display:none}
.step-cond-label{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px}
.step-title{font-size:12px;font-weight:700;color:#475569;margin-bottom:6px}
.step-text{font-size:13px;line-height:1.6;white-space:pre-wrap;background:rgba(255,255,255,0.5);
  border-radius:9px;padding:9px;border:1px solid var(--border);margin-bottom:8px}
.var-missing{background:rgba(239,68,68,0.12);border-radius:4px;padding:0 3px;color:var(--red);font-weight:600}
.var-filled{background:rgba(2,189,182,0.1);border-radius:4px;padding:0 3px;color:var(--brand);font-weight:600}

/* Variable inputs */
.step-vars{background:rgba(255,255,255,0.4);border-radius:9px;padding:7px 9px;margin-bottom:8px;
  border:1px solid var(--border)}
.var-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.var-row:last-child{margin-bottom:0}
.var-label{font-size:12px;color:#64748b;font-weight:600;min-width:80px;flex-shrink:0}
.var-row input{flex:1;padding:5px 8px;border:1.5px solid var(--border);border-radius:8px;
  background:rgba(255,255,255,0.8);font-size:14px;font-family:inherit;outline:none;margin-bottom:0}
.var-row input:focus{border-color:var(--brand)}
.var-row input.missing{border-color:rgba(239,68,68,0.5);background:rgba(239,68,68,0.04)}

/* IMT hint */
.imt-hint{background:rgba(38,60,217,0.05);border:1px solid rgba(38,60,217,0.15);border-radius:8px;
  padding:6px 10px;margin-bottom:8px;font-size:12px;color:#374151}
.imt-hint strong{color:var(--accent)}

/* Step actions */
.step-actions{display:flex;gap:6px;flex-wrap:wrap}
.act-btn{padding:7px 12px;border:none;border-radius:9px;font-size:12px;font-weight:600;
  font-family:inherit;cursor:pointer;transition:opacity .12s}
.act-btn:disabled{opacity:.4;cursor:not-allowed}
.act-insert{background:linear-gradient(135deg,var(--brand),var(--accent));color:#fff}
.act-insert:hover:not(:disabled){opacity:.88}
.act-copy{background:rgba(255,255,255,0.8);border:1.5px solid var(--border);color:#475569}
.act-copy:hover{background:rgba(2,189,182,0.06)}
.act-done{background:rgba(34,197,94,0.1);border:1.5px solid rgba(34,197,94,0.3);color:#15803d;font-size:12px}
.act-done:hover{background:rgba(34,197,94,0.15)}

/* Stage footer */
.stage-refs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 6px}
.ref-btn{padding:5px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:12px;
  font-weight:600;font-family:inherit;cursor:pointer;background:rgba(255,255,255,0.7);color:#475569;transition:all .12s}
.ref-btn:hover{background:rgba(2,189,182,0.08);border-color:rgba(2,189,182,0.3)}
.stage-done-btn{width:100%;padding:7px;border:1.5px dashed rgba(34,197,94,0.4);border-radius:9px;
  background:rgba(34,197,94,0.05);color:#16a34a;font-size:12px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:all .12s;margin-top:4px}
.stage-done-btn:hover{background:rgba(34,197,94,0.1)}

/* Note block */
.step-note{font-size:11px;color:#94a3b8;border-left:2px solid var(--border);padding-left:7px;
  margin-bottom:8px;line-height:1.4}

/* Reminder item (stage 7.4) */
.reminder-item{background:rgba(255,255,255,0.5);border:1px solid var(--border);border-radius:9px;
  padding:8px;margin-bottom:6px}
.reminder-item .rem-title{font-size:11px;font-weight:700;color:#64748b;margin-bottom:4px}

/* ── Reference drawer ────────────────────────── */
.draw-backdrop{position:fixed;inset:0;z-index:30;background:rgba(238,242,247,0.5);backdrop-filter:blur(2px);
  display:none}
.draw-backdrop.open{display:block}
.draw-panel{position:fixed;bottom:0;left:0;right:0;z-index:31;max-height:80vh;
  background:var(--glass);backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--border);border-radius:16px 16px 0 0;box-shadow:0 -4px 24px rgba(2,49,100,0.12);
  display:none;flex-direction:column}
.draw-panel.open{display:flex}
.draw-handle{width:36px;height:4px;background:rgba(0,0,0,0.12);border-radius:2px;margin:8px auto 0}
.draw-header{display:flex;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.draw-header h3{font-size:14px;font-weight:700;flex:1}
.draw-content{overflow-y:auto;padding:10px 12px}
.draw-item{background:rgba(255,255,255,0.5);border:1px solid var(--border);border-radius:10px;
  padding:9px;margin-bottom:7px}
.draw-item-title{font-size:12px;font-weight:700;color:#475569;margin-bottom:5px}
.draw-item-text{font-size:13px;line-height:1.55;white-space:pre-wrap;color:#1a202c;margin-bottom:7px}
.draw-item-actions{display:flex;gap:5px}

/* ── Dialogs ─────────────────────────────────── */
.dialog-wrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;
  background:rgba(238,242,247,0.7);backdrop-filter:blur(4px)}
.dialog-wrap.open{display:flex}
.dialog-card{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);
  border-radius:16px;padding:20px;width:300px;box-shadow:var(--shadow)}
.dialog-card h3{font-size:16px;font-weight:700;margin-bottom:14px}
.row-btns{display:flex;gap:8px;margin-top:10px}
.row-btns button{flex:1}

/* ── Diagnostics drawer ──────────────────────── */
.diag-msg{padding:5px 8px;border-radius:6px;font-size:11px;margin-bottom:3px;display:flex;gap:8px;align-items:flex-start}
.diag-in{background:rgba(255,255,255,0.7)}
.diag-out{background:rgba(2,189,182,0.06);flex-direction:row-reverse}
</style>
</head>
<body>
<div class="blob b1"></div>
<div class="blob b2"></div>

<!-- Login -->
<div id="login-screen" class="screen">
  <div class="card">
    <div class="logo">SW</div>
    <h1>Скриптолог</h1>
    <p class="sub">SlimWay</p>
    <input type="text" id="l-login" placeholder="Логин" autocomplete="username" autocapitalize="none">
    <input type="password" id="l-pw" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" id="l-btn">Войти</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div id="status-bar">
    <span id="status-dot"></span>
    <span id="status-text">Загрузка...</span>
    <div class="toggle-row" id="toggles" style="display:none">
      <button class="lang-btn active" id="btn-lang-ru" onclick="setLang('ru')">RU</button>
      <button class="lang-btn" id="btn-lang-kk" onclick="setLang('kk')">KZ</button>
      <button class="gnd-btn active" id="btn-gnd-f" onclick="setGender('f')">Ж</button>
      <button class="gnd-btn" id="btn-gnd-m" onclick="setGender('m')">М</button>
      <button class="icon-btn" id="btn-diag" title="Диагностика" style="display:none" onclick="openDiagDraw()">⚙</button>
    </div>
  </div>

  <div id="client-card" style="display:none">
    <div id="cc-row1">
      <span id="cc-name">—</span>
      <span id="cc-channel" class="chip chip-blue"></span>
      <span id="cc-status-badge" class="chip" style="display:none"></span>
    </div>
    <div id="cc-phone-row">
      <span id="cc-phone" style="color:#64748b;font-size:11px">нет телефона</span>
      <button id="bind-phone-btn" class="small-btn brand" style="display:none">📱 Привязать</button>
    </div>
    <div id="cc-facts"></div>
    <div id="cc-mgr-row">
      <span id="cc-mgr-label">Менеджер:</span>
      <span id="cc-mgr-val" style="font-weight:600;color:#475569">—</span>
      <button class="icon-btn" id="mgr-edit-btn" title="Изменить менеджера">✏️</button>
    </div>
  </div>

  <div id="main-area">
    <div id="kz-banner" class="kz-banner" style="display:none">
      🇰🇿 Клиентка, похоже, пишет по-казахски
      <button class="small-btn brand" onclick="setLang('kk')" style="margin-left:auto;white-space:nowrap">Перейти на KZ</button>
    </div>

    <div id="no-client-msg" class="info-msg">
      👆 Открой диалог в Fitbase Chat<br>
      <span style="font-size:11px">Панель подключится автоматически</span>
    </div>

    <div id="accordion" style="display:none"></div>
  </div>
</div>

<!-- Reference drawer backdrop -->
<div id="draw-backdrop" class="draw-backdrop" onclick="closeDraw()"></div>

<!-- Reference / Diagnostics drawer -->
<div id="draw-panel" class="draw-panel">
  <div class="draw-handle"></div>
  <div class="draw-header">
    <h3 id="draw-title">Справочник</h3>
    <button class="small-btn" onclick="closeDraw()">✕</button>
  </div>
  <div id="draw-content" class="draw-content"></div>
</div>

<!-- Bind phone dialog -->
<div id="bind-dialog" class="dialog-wrap">
  <div class="dialog-card">
    <h3>📱 Привязать телефон</h3>
    <input type="tel" id="bind-input" placeholder="+7 ___ ___ __ __">
    <div class="err" id="bind-err"></div>
    <div class="row-btns">
      <button class="btn" id="bind-ok" style="width:auto;flex:1">Привязать</button>
      <button class="small-btn" id="bind-cancel" style="flex:1">Отмена</button>
    </div>
  </div>
</div>

<!-- Manager edit dialog -->
<div id="mgr-dialog" class="dialog-wrap">
  <div class="dialog-card">
    <h3>✏️ Имя менеджера</h3>
    <input type="text" id="mgr-input" placeholder="Имя менеджера">
    <div class="row-btns">
      <button class="btn" id="mgr-ok" style="width:auto;flex:1">Сохранить</button>
      <button class="small-btn" id="mgr-cancel" style="flex:1">Отмена</button>
    </div>
  </div>
</div>

<!-- Fact input dialog -->
<div id="fact-dialog" class="dialog-wrap">
  <div class="dialog-card">
    <h3 id="fact-dialog-title">Введите значение</h3>
    <input type="text" id="fact-input" placeholder="">
    <div class="row-btns">
      <button class="btn" id="fact-ok" style="width:auto;flex:1">Сохранить</button>
      <button class="small-btn" id="fact-cancel" style="flex:1">Отмена</button>
    </div>
  </div>
</div>

<script>
const SERVER = location.origin;

// ── State ──────────────────────────────────────
const S = {
  token:        null,
  manager:      '',
  tree:         null,   // v2 tree
  client:       null,
  events:       [],
  vars:         {},
  gender:       'f',    // 'f' | 'm'
  lang:         'ru',   // 'ru' | 'kk'
  isAdmin:      false,
  embedded:     window.parent !== window,
  chatReady:    false,
  chatMsgs:     [],
  activeStage:  1,
  completedStages: new Set(),
  lastInsertedText: null,
};

// ── Boot ───────────────────────────────────────
function decodeJWT(token) {
  try { return JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); } catch { return {}; }
}

function boot() {
  bindUI();
  const saved = sessionStorage.getItem('sw_token');
  if (saved) {
    S.token = saved;
    S.isAdmin = decodeJWT(saved).role === 'admin';
    showApp();
    loadTree();
  } else if (S.embedded) {
    window.parent.postMessage({type:'ready'}, '*');
    window.addEventListener('message', onParentMsg);
    setTimeout(() => { if (!S.token) showLogin(); }, 2500);
  } else {
    showLogin();
  }
}

function onParentMsg(e) {
  const ok = e.origin === 'null' || e.origin === null || (typeof e.origin === 'string' && e.origin.startsWith('chrome-extension://'));
  if (!ok) return;
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'auth' && d.token)       { S.token = d.token; S.isAdmin = decodeJWT(d.token).role === 'admin'; sessionStorage.setItem('sw_token', d.token); showApp(); loadTree(); }
  if (d.type === 'client')                 onClientData(d);
  if (d.type === 'manager' && d.name)      { S.manager = d.name; sessionStorage.setItem('sw_mgr', d.name); renderMgr(); }
  if (d.type === 'chat-status')            updateChatStatus(d.ready);
  if (d.type === 'chat-message')           onChatMessage(d);
}

// ── Login ──────────────────────────────────────
function showLogin() { document.getElementById('login-screen').classList.remove('hidden'); }
function showApp()   {
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('toggles').style.display = '';
  if (S.isAdmin) document.getElementById('btn-diag').style.display = '';
}

function doLogin() {
  const login = document.getElementById('l-login').value.trim();
  const pw    = document.getElementById('l-pw').value;
  const errEl = document.getElementById('l-err');
  const btnEl = document.getElementById('l-btn');
  errEl.textContent = ''; btnEl.disabled = true;
  api('POST', '/api/scriptolog/login', {login, password: pw})
    .then(d => {
      S.token = d.token;
      S.manager = d.display_name || '';
      S.isAdmin = decodeJWT(d.token).role === 'admin';
      sessionStorage.setItem('sw_token', d.token);
      sessionStorage.setItem('sw_mgr', S.manager);
      if (S.embedded) window.parent.postMessage({type:'login', token: d.token}, '*');
      showApp();
      loadTree();
    })
    .catch(e => { errEl.textContent = e.message || 'Ошибка входа'; btnEl.disabled = false; });
}

// ── API helper ─────────────────────────────────
function api(method, url, body) {
  const headers = {'Content-Type': 'application/json'};
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  return fetch(SERVER + url, {method, headers, body: body ? JSON.stringify(body) : undefined})
    .then(r => r.json().then(d => { if (!r.ok) throw new Error(d.error || r.status); return d; }));
}

// ── Tree loading ───────────────────────────────
function loadTree() {
  api('GET', '/api/scriptolog/tree')
    .then(tree => {
      S.tree = tree;
      if (!S.manager) {
        S.manager = sessionStorage.getItem('sw_mgr') || '';
        renderMgr();
      }
    })
    .catch(e => console.error('tree load:', e));
}

// ── Client data ────────────────────────────────
function onClientData(d) {
  if (!S.token) return;
  setStatus(false, '🔄 Загружаю клиентку…');
  api('POST', '/api/scriptolog/client', {name: d.name, phone: d.phone || null, channel: d.channel || 'unknown'})
    .then(r => {
      S.client  = r.client;
      S.events  = r.events || [];
      S.vars    = (r.client.vars && typeof r.client.vars === 'object') ? {...r.client.vars} : {};
      S.gender  = S.vars.gender === 'm' ? 'm' : 'f';
      S.completedStages = new Set();
      S.activeStage = 1;
      if (S.vars.lang === 'kk') setLangSilent('kk'); else setLangSilent('ru');
      updateGenderBtns();
      // Restore active stage from current_node (stage number stored as "stage:N")
      if (r.client.current_node && r.client.current_node.startsWith('stage:')) {
        S.activeStage = parseInt(r.client.current_node.slice(6)) || 1;
      }
      renderClientCard();
      renderAccordion();
      document.getElementById('no-client-msg').style.display = 'none';
      document.getElementById('accordion').style.display = '';
      setStatus(true, '✅ Чат подключён');
    })
    .catch(e => { setStatus(false, '⚠ Ошибка загрузки: ' + e.message); });
}

// ── Status bar ─────────────────────────────────
function setStatus(ok, text) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = ok ? 'ok' : '';
}
function updateChatStatus(ready) {
  S.chatReady = !!ready;
  if (ready) {
    if (!S.client) setStatus(false, '👆 Открой диалог в Fitbase Chat');
    else           setStatus(true,  '✅ Чат подключён');
  } else {
    setStatus(false, '⚠ Не нашёл поле ввода — сообщи Сергею');
  }
}

// ── Client card ────────────────────────────────
function renderClientCard() {
  const c = S.client;
  if (!c) { document.getElementById('client-card').style.display = 'none'; return; }
  document.getElementById('client-card').style.display = '';
  document.getElementById('cc-name').textContent = c.name || '—';
  document.getElementById('cc-channel').textContent = c.channel || '?';
  if (c.phone) {
    document.getElementById('cc-phone').textContent = c.phone;
    document.getElementById('bind-phone-btn').style.display = 'none';
  } else {
    document.getElementById('cc-phone').textContent = 'нет телефона';
    document.getElementById('bind-phone-btn').style.display = '';
  }
  const sb = document.getElementById('cc-status-badge');
  const labels = {booked:'записана',refused:'отказала',dnd:'не беспокоить',confirmed_trial:'подтвердила'};
  const colors  = {booked:'chip-green',refused:'chip-red',dnd:'chip-gray',confirmed_trial:'chip-green'};
  if (c.status && c.status !== 'active') {
    sb.style.display = '';
    sb.textContent = labels[c.status] || c.status;
    sb.className = 'chip ' + (colors[c.status] || 'chip-gray');
  } else {
    sb.style.display = 'none';

  renderFacts();
  renderMgr();

function renderFacts() {
  const el = document.getElementById('cc-facts');
  if (!S.client) { el.innerHTML = ''; return; }
  const facts = S.client.facts || {};
  let html = '';
  for (const [k,v] of Object.entries(facts)) {
    if (!v) continue;
    html += `<span class="chip chip-blue" style="font-size:10px">${esc(String(v).slice(0,20))}</span>`;
  }
  el.innerHTML = html;
}

function renderMgr() {
  const mgr = S.manager || S.client?.last_manager || S.client?.first_manager || '—';
  document.getElementById('cc-mgr-val').textContent = mgr;
  S.manager = S.manager || (S.client?.last_manager ?? '') || '';
}

// ── RU/KZ language ─────────────────────────────
function setLang(lang) {
  setLangSilent(lang);
  if (S.client) {
    S.vars = {...S.vars, lang};
    api('POST', '/api/scriptolog/event', {client_id: S.client.id, event_type: 'fact',
      node_id: 'stage:' + S.activeStage, fact_key: 'lang', fact_value: lang, manager: S.manager}).catch(() => {});
  }
  refreshAllPreviews();
}
function setLangSilent(lang) {
  S.lang = lang;
  document.getElementById('btn-lang-ru').classList.toggle('active', lang === 'ru');
  document.getElementById('btn-lang-kk').classList.toggle('active', lang === 'kk');
  if (lang === 'kk') document.getElementById('kz-banner').style.display = 'none';
}

// ── Gender ─────────────────────────────────────
function setGender(g) {
  S.gender = g;
  updateGenderBtns();
  if (S.client) {
    S.vars = {...S.vars, gender: g};
    api('POST', '/api/scriptolog/event', {client_id: S.client.id, event_type: 'fact',
      node_id: 'stage:' + S.activeStage, fact_key: 'gender', fact_value: g, manager: S.manager}).catch(() => {});
  }
  refreshAllPreviews();
}
function updateGenderBtns() {
  document.getElementById('btn-gnd-f').classList.toggle('active', S.gender === 'f');
  document.getElementById('btn-gnd-m').classList.toggle('active', S.gender === 'm');
}
function autoDetectGender(name) {
  if (!name) return 'f';
  const n = name.trim().toLowerCase();
  // Names ending in 'а', 'я', 'ь' (female in Russian/Kazakh)
  return /[аяь]$/.test(n) ? 'f' : 'm';
}

// ── Text helpers ───────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function resolveGender(text) {
  return text.replace(/\[ж:([^|]*)\|м:([^\]]*)\]/g, (_, f, m) => S.gender === 'm' ? m.trim() : f.trim());
}

function getStepText(step) {
  const raw = (S.lang === 'kk' && step.text_kk) ? step.text_kk : (step.text || '');
  return resolveGender(raw);
}

function getConsts() {
  return (S.tree && S.tree.constants) || {};
}

function fillText(raw) {
  const consts = getConsts();
  return raw.replace(/\{([^}]+)\}/g, (_, v) => {
    if (consts[v]) return consts[v];
    if (S.vars[v]) return S.vars[v];
    return '{' + v + '}';
  });
}

function hasMissing(raw) {
  const consts = getConsts();
  const re = /\{([^}]+)\}/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    if (!consts[m[1]] && !S.vars[m[1]]) return true;
  }
  return false;
}

function renderTextWithHighlight(raw) {
  const consts = getConsts();
  return esc(raw).replace(/\{([^}]+)\}/g, (_, v) => {
    if (consts[v]) return `<span class="var-filled">{${esc(v)}}</span>`;
    if (S.vars[v]) return `<span class="var-filled">${esc(S.vars[v])}</span>`;
    return `<span class="var-missing">{${esc(v)}}</span>`;
  });
}

function parseVarNames(raw) {
  const consts = getConsts();
  const found = [];
  const re = /\{([^}]+)\}/g;
  let m;
  while ((m = re.exec(raw)) !== null) {
    if (!consts[m[1]] && !found.includes(m[1])) found.push(m[1]);
  }
  return found;
}

// ── IMT calculation ─────────────────────────────
function calcIMT() {
  const h = parseFloat(S.vars['Рост']);
  const w = parseFloat(S.vars['Вес']);
  if (!h || !w || h < 50 || h > 250 || w < 20 || w > 300) return null;
  const imt = w / ((h / 100) ** 2);
  const hints = (S.tree && S.tree.imt_hints) || [];
  for (const hint of hints) {
    if (imt <= hint.max) {
      return { imt: imt.toFixed(1), hint: (S.lang === 'kk' && hint.text_kk) ? hint.text_kk : hint.text };
    }
  }
  return null;
}

function updateIMTHint(container) {
  const el = container.querySelector('.imt-hint');
  if (!el) return;
  const result = calcIMT();
  if (result) {
    el.style.display = '';
    el.innerHTML = `💡 ИМТ ${result.imt}: <strong>${esc(result.hint)}</strong>`;
    S.vars['ИМТ'] = result.imt;
  } else {
    el.style.display = 'none';
  }
}

// ── Variable inputs ─────────────────────────────
const _varSaveTimers = {};

function setVar(varName, value) {
  S.vars[varName] = value;
  // Update preview text without rebuilding inputs
  refreshAllPreviews();
  // Update this input's CSS class in-place
  const inp = document.querySelector(`.var-input[data-var="${CSS.escape(varName)}"]`);
  if (inp) inp.classList.toggle('missing', !value);
  // IMT hint when height/weight change
  if (varName === 'Рост' || varName === 'Вес') {
    document.querySelectorAll('.imt-hint').forEach(el => {
      const result = calcIMT();
      if (result) { el.style.display = ''; el.innerHTML = `💡 ИМТ ${result.imt}: <strong>${esc(result.hint)}</strong>`; S.vars['ИМТ'] = result.imt; }
      else el.style.display = 'none';
    });
  }
  // Auto-detect gender from name
  if (varName === 'Имя') {
    const g = autoDetectGender(value);
    if (g !== S.gender) { S.gender = g; updateGenderBtns(); }
  }
  // Check auto-close conditions
  checkAutoClose(S.activeStage);
  // Update insert button states
  document.querySelectorAll('.step-insert-btn').forEach(btn => {
    const stepId = btn.dataset.stepId;
    const card = document.getElementById('step-' + stepId);
    if (!card) return;
    const rawEl = card.querySelector('.step-text-raw');
    if (rawEl) btn.disabled = hasMissing(rawEl.dataset.raw || '');
  });
  // Debounced persist
  if (S.client) {
    clearTimeout(_varSaveTimers[varName]);
    _varSaveTimers[varName] = setTimeout(() => {
      api('POST', '/api/scriptolog/event', {
        client_id: S.client.id, event_type: 'fact',
        node_id: 'stage:' + S.activeStage, fact_key: varName, fact_value: value, manager: S.manager,
      }).catch(() => {});
    }, 1000);
  }
}

function refreshAllPreviews() {
  document.querySelectorAll('.step-text-raw').forEach(el => {
    const raw = el.dataset.raw || '';
    const preview = el.closest('.step-card')?.querySelector('.step-text-preview');
    if (preview) preview.innerHTML = renderTextWithHighlight(raw).replace(/\n/g, '<br>');
    // Update kz-orig if present
    const orig = el.closest('.step-card')?.querySelector('.kz-orig');
    if (orig && S.lang === 'kk') orig.style.display = '';
  });
  // Refresh step text in draw panel too
  document.querySelectorAll('.draw-text-raw').forEach(el => {
    const raw = el.dataset.raw || '';
    const preview = el.closest('.draw-item')?.querySelector('.draw-item-text');
    if (preview) preview.innerHTML = renderTextWithHighlight(raw).replace(/\n/g, '<br>');
  });
  // Update stage summaries
  updateStageSummaries();
  // Update step visibility based on conditions
  updateStepVisibility();
}

function updateStageSummaries() {
  for (let i = 1; i <= 7; i++) {
    const el = document.getElementById('stage-summary-' + i);
    if (!el) continue;
    el.textContent = buildStageSummary(i);
  }
}

function buildStageSummary(id) {
  const parts = [];
  if (id === 1) {
    if (S.vars['Имя'])    parts.push(S.vars['Имя']);
    if (S.vars['Цель'])   parts.push(S.vars['Цель']);
  } else if (id === 2) {
    if (S.vars['Опыт'])   parts.push(S.vars['Опыт']);
  } else if (id === 3) {
    parts.push('Текст отправлен');
  } else if (id === 4) {
    if (S.vars['Дата'])   parts.push(S.vars['Дата']);
    if (S.vars['Время'])  parts.push(S.vars['Время']);
  } else if (id === 5) {
    parts.push('Записана');
  } else if (id === 6) {
    parts.push('Подтверждено');
  } else if (id === 7) {
    parts.push('Завершено');
  }
  return parts.join(' · ');
}

function updateStepVisibility() {
  // 1.1-no-name: hide when name is set; 1.1-has-name: show when name is set
  const noNameCard = document.getElementById('step-1.1-no-name');
  const hasNameCard = document.getElementById('step-1.1-has-name');
  if (noNameCard)  noNameCard.classList.toggle('hidden', !!S.vars['Имя']);
  if (hasNameCard) hasNameCard.classList.toggle('hidden', !S.vars['Имя']);
  // 1.2 clarify: show when stage 1 not complete
  const clarifyCard = document.getElementById('step-1.2');
  if (clarifyCard) {
    const stage1Done = S.vars['Имя'] && S.vars['Цель'];
    clarifyCard.classList.toggle('hidden', !!stage1Done);
    // Update clarify dynamic text
    updateClarifyText();
  }
}

function updateClarifyText() {
  const card = document.getElementById('step-1.2');
  if (!card) return;
  const stage = S.tree?.stages?.find(s => s.id === 1);
  const step  = stage?.steps?.find(s => s.id === '1.2');
  if (!step) return;
  const missing = buildMissingList();
  if (!missing) return;
  const rawRU = step.text.replace('{недостающее}', missing.ru);
  const rawKK = step.text_kk ? step.text_kk.replace('{недостающее}', missing.kk) : '';
  const raw = (S.lang === 'kk' && rawKK) ? rawKK : rawRU;
  const textEl = card.querySelector('.step-text-raw');
  if (textEl) textEl.dataset.raw = raw;
  const preview = card.querySelector('.step-text-preview');
  if (preview) preview.innerHTML = renderTextWithHighlight(raw).replace(/\n/g, '<br>');
  const insertBtn = card.querySelector('.step-insert-btn');
  if (insertBtn) { insertBtn.dataset.text = fillText(raw); insertBtn.disabled = hasMissing(raw); }
}

function buildMissingList() {
  const stage = S.tree?.stages?.find(s => s.id === 1);
  const step  = stage?.steps?.find(s => s.id === '1.2');
  if (!step || !step.clarify_fields) return null;
  const missingRU = [], missingKK = [];
  for (const [varName, labels] of Object.entries(step.clarify_fields)) {
    if (!S.vars[varName]) {
      missingRU.push(labels.ru);
      missingKK.push(labels.kk);
    }
  }
  if (!missingRU.length) return null;
  const joinRU = missingRU.length === 1 ? missingRU[0] : missingRU.slice(0,-1).join(', ') + ' и ' + missingRU.slice(-1);
  const joinKK = missingKK.length === 1 ? missingKK[0] : missingKK.slice(0,-1).join(', ') + ' және ' + missingKK.slice(-1);
  return { ru: joinRU, kk: joinKK };
}

// ── Accordion rendering ────────────────────────
function renderAccordion() {
  const el = document.getElementById('accordion');
  if (!S.tree) { el.innerHTML = '<p class="info-msg">Дерево не загружено</p>'; return; }
  el.innerHTML = (S.tree.stages || []).map(stage => renderStageHTML(stage)).join('');
  // Open active stage
  openStage(S.activeStage, false);
  // Initial visibility update
  updateStepVisibility();
}

function renderStageHTML(stage) {
  const isOpen   = stage.id === S.activeStage;
  const isDone   = S.completedStages.has(stage.id);
  const steps    = (stage.steps || []).map(step => renderStepHTML(step, stage.id)).join('');
  const summary  = buildStageSummary(stage.id);

  return `<div class="stage-item${isOpen?' open':''}${isDone?' done':''}" id="stage-item-${stage.id}">
    <button class="stage-header" onclick="toggleStage(${stage.id})">
      <span class="stage-num">${stage.id}</span>
      <span class="stage-title">${esc(stage.title)}</span>
      ${isDone ? `<span class="stage-check">✅</span><span class="stage-summary" id="stage-summary-${stage.id}">${esc(summary)}</span>` :
                 `<span class="stage-summary" id="stage-summary-${stage.id}">${esc(summary)}</span>`}
      <span class="stage-chevron">▼</span>
    </button>
    <div class="stage-body">
      ${steps}
      <div class="stage-refs">
        <button class="ref-btn" onclick="openDraw('objections')">💬 Возражения</button>
        <button class="ref-btn" onclick="openDraw('questions')">❓ Вопросы</button>
        <button class="ref-btn" onclick="openDraw('silent')">🤫 Молчит</button>
      </div>
      <button class="stage-done-btn" onclick="completeStage(${stage.id})">✓ Этап пройден</button>
    </div>
  </div>`;
}

function renderStepHTML(step, stageId) {
  if (step.reminders) return renderRemindersHTML(step, stageId);
  const raw = getStepText(step);
  const rawRU = step.text || '';
  const hidden = getStepHidden(step);
  const vars = parseVarNames(raw).filter(v => v !== 'ИМТ');
  const needIMT = (stageId === 1 && (raw.includes('{Рост}') || vars.includes('Рост') || vars.includes('Вес'))) ||
                  vars.includes('Рост') || vars.includes('Вес');
  const condLabel = getCondLabel(step);

  let html = `<div class="step-card${hidden?' hidden':''}" id="step-${step.id}">`;
  if (condLabel) html += `<div class="step-cond-label">${esc(condLabel)}</div>`;
  if (step.title && step.title !== 'Уточнение') html += `<div class="step-title">${esc(step.title)}</div>`;
  if (step.note) html += `<div class="step-note">${esc(step.note)}</div>`;

  // Hidden element to store raw text for preview updates
  html += `<span class="step-text-raw" data-raw="${esc(raw)}" style="display:none"></span>`;
  html += `<div class="step-text step-text-preview">${renderTextWithHighlight(raw).replace(/\n/g,'<br>')}</div>`;
  if (S.lang === 'kk' && rawRU && rawRU !== raw) {
    html += `<div class="kz-orig">${esc(rawRU)}</div>`;
  }

  // Var inputs (built once per render)
  if (vars.length > 0) {
    html += `<div class="step-vars">`;
    for (const v of vars) {
      html += `<div class="var-row">
        <span class="var-label">{${esc(v)}}</span>
        <input type="text" value="${esc(S.vars[v]||'')}" class="var-input${S.vars[v]?'':' missing'}"
          data-var="${esc(v)}" placeholder="введи…" oninput="setVar('${v.replace(/'/g,"\\'")}', this.value)">
      </div>`;
    }
    html += `</div>`;
    if (needIMT) {
      const imt = calcIMT();
      html += `<div class="imt-hint" style="${imt?'':'display:none'}">💡 ИМТ ${imt?.imt || ''}: <strong>${esc(imt?.hint || '')}</strong></div>`;
    }
  }

  const missing = hasMissing(raw);
  html += `<div class="step-actions">
    <button class="act-btn act-insert step-insert-btn" data-step-id="${step.id}" ${missing?'disabled':''}
      onclick="insertStep('${step.id}')">📤 Вставить</button>
    <button class="act-btn act-copy" onclick="copyStep('${step.id}')">📋</button>
  </div>`;

  if (step.note_other_club) {
    const club = (S.lang==='kk'&&step.note_other_club.text_kk)?step.note_other_club.text_kk:step.note_other_club.text;
    html += `<div class="step-note" style="margin-top:6px;cursor:pointer" onclick="insertRaw('${esc(club)}')" title="Вставить">
      ➕ <em>${esc(club)}</em></div>`;
  }

  html += `</div>`;
  return html;
}

function renderRemindersHTML(step, stageId) {
  let html = `<div class="step-card" id="step-${step.id}">`;
  if (step.title) html += `<div class="step-title">${esc(step.title)}</div>`;
  if (step.note)  html += `<div class="step-note">${esc(step.note)}</div>`;
  for (const r of (step.reminders || [])) {
    const text = (S.lang==='kk'&&r.text_kk)?r.text_kk:r.text;
    html += `<div class="reminder-item">
      <div class="rem-title">${esc(r.kind.replace(/_/g,' '))}</div>
      <span class="step-text-raw" data-raw="${esc(text)}" style="display:none"></span>
      <div class="draw-item-text step-text-preview">${renderTextWithHighlight(text).replace(/\n/g,'<br>')}</div>
      <div class="draw-item-actions">
        <button class="act-btn act-insert" onclick="insertRaw('${esc(fillText(text))}')">📤</button>
        <button class="act-btn act-copy"   onclick="copyRaw('${esc(fillText(text))}')">📋</button>
      </div>
    </div>`;
  }
  html += `</div>`;
  return html;
}

function getStepHidden(step) {
  if (step.cond === 'no_name')  return !!S.vars['Имя'];
  if (step.cond === 'has_name') return !S.vars['Имя'];
  if (step.cond === 'clarify')  return !!(S.vars['Имя'] && S.vars['Цель']);
  return false;
}

function getCondLabel(step) {
  if (step.cond === 'no_name')  return 'Если имени нет';
  if (step.cond === 'has_name') return 'Если имя известно';
  if (step.cond === 'clarify')  return 'Уточнение (если что-то не заполнено)';
  return '';
}

// ── Accordion interaction ──────────────────────
function toggleStage(id) {
  const el = document.getElementById('stage-item-' + id);
  if (!el) return;
  const isOpen = el.classList.contains('open');
  if (!isOpen) openStage(id, true);
  else         closeStage(id);
}

function openStage(id, log) {
  // Close all, open target
  document.querySelectorAll('.stage-item.open').forEach(el => {
    el.classList.remove('open');
  });
  const el = document.getElementById('stage-item-' + id);
  if (el) el.classList.add('open');
  S.activeStage = id;
  if (log && S.client) {
    logEvent({event_type: 'jump', node_id: 'stage:' + id, manager: S.manager});
  }
}

function closeStage(id) {
  const el = document.getElementById('stage-item-' + id);
  if (el) el.classList.remove('open');
}

function completeStage(id) {
  S.completedStages.add(id);
  const el = document.getElementById('stage-item-' + id);
  if (el) { el.classList.add('done'); el.classList.remove('open'); }
  updateStageSummaries();
  logEvent({event_type: 'answer', node_id: 'stage:' + id, manager: S.manager});
  // Open next stage
  if (id < 7) openStage(id + 1, true);
}

function checkAutoClose(stageId) {
  if (S.completedStages.has(stageId)) return;
  let shouldClose = false;
  if (stageId === 1 && S.vars['Имя'] && S.vars['Цель']) shouldClose = true;
  if (stageId === 4 && S.vars['Дата'] && S.vars['Время']) shouldClose = true;
  if (shouldClose) {
    // Don't auto-complete — let manager decide
    updateStageSummaries();
  }
}

// ── Insert / Copy ──────────────────────────────
function insertStep(stepId) {
  const stage = S.tree?.stages?.find(s => s.steps?.find(st => st.id === stepId));
  const step = stage?.steps?.find(st => st.id === stepId);
  if (!step) return;
  let raw = getStepText(step);
  if (stepId === '1.2') {
    const missing = buildMissingList();
    if (missing) raw = raw.replace('{недостающее}', S.lang === 'kk' ? missing.kk : missing.ru);
  }
  const text = fillText(raw);
  if (hasMissing(raw)) return;
  S.lastInsertedText = text;
  sendToExtension({type: 'insert', text});
  logEvent({event_type: 'insert', node_id: stepId, text, manager: S.manager});
}

function copyStep(stepId) {
  const stage = S.tree?.stages?.find(s => s.steps?.find(st => st.id === stepId));
  const step = stage?.steps?.find(st => st.id === stepId);
  if (!step) return;
  let raw = getStepText(step);
  if (stepId === '1.2') {
    const missing = buildMissingList();
    if (missing) raw = raw.replace('{недостающее}', S.lang === 'kk' ? missing.kk : missing.ru);
  }
  const text = fillText(raw);
  navigator.clipboard?.writeText(text).catch(() => {});
  logEvent({event_type: 'copy', node_id: stepId, manager: S.manager});
}

function insertRaw(text) {
  const decoded = text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  sendToExtension({type: 'insert', text: decoded});
  logEvent({event_type: 'insert', node_id: 'stage:' + S.activeStage, text: decoded, manager: S.manager});
}

function copyRaw(text) {
  const decoded = text.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"');
  navigator.clipboard?.writeText(decoded).catch(() => {});
}

// ── Reference drawer ───────────────────────────
const DRAW_TITLES = { objections: '💬 Возражения', questions: '❓ Вопросы', silent: '🤫 Молчит', diag: '⚙ Диагностика' };

function openDraw(type) {
  document.getElementById('draw-title').textContent = DRAW_TITLES[type] || type;
  renderDrawContent(type);
  document.getElementById('draw-backdrop').classList.add('open');
  document.getElementById('draw-panel').classList.add('open');
}

function closeDraw() {
  document.getElementById('draw-backdrop').classList.remove('open');
  document.getElementById('draw-panel').classList.remove('open');
}

function renderDrawContent(type) {
  const el = document.getElementById('draw-content');
  if (type === 'diag') { renderDiagInDraw(el); return; }
  const items = S.tree?.refs?.[type] || [];
  if (!items.length) { el.innerHTML = '<p class="info-msg">Нет данных</p>'; return; }
  el.innerHTML = items.map(item => {
    const rawRU = item.text || '';
    const raw   = (S.lang === 'kk' && item.text_kk) ? item.text_kk : rawRU;
    const kkOrig = (S.lang === 'kk' && rawRU && rawRU !== raw) ? `<div class="kz-orig">${esc(rawRU)}</div>` : '';
    const filled = fillText(raw);
    return `<div class="draw-item">
      <div class="draw-item-title">${esc(item.title || item.id)}</div>
      <span class="draw-text-raw" data-raw="${esc(raw)}" style="display:none"></span>
      <div class="draw-item-text">${renderTextWithHighlight(raw).replace(/\n/g,'<br>')}</div>
      ${kkOrig}
      <div class="draw-item-actions">
        <button class="act-btn act-insert" onclick="insertRaw('${esc(filled)}')">📤 Вставить</button>
        <button class="act-btn act-copy"   onclick="copyRaw('${esc(filled)}')">📋</button>
      </div>
    </div>`;
  }).join('');
}

function openDiagDraw() {
  document.getElementById('draw-title').textContent = DRAW_TITLES.diag;
  renderDiagInDraw(document.getElementById('draw-content'));
  document.getElementById('draw-backdrop').classList.add('open');
  document.getElementById('draw-panel').classList.add('open');
}

function renderDiagInDraw(el) {
  if (!S.chatMsgs.length) { el.innerHTML = '<p class="info-msg">Нет сообщений</p>'; return; }
  el.innerHTML = `<p style="font-size:11px;color:#94a3b8;margin-bottom:8px">Последние сообщения из EasyChat · текст не сохраняется в базу</p>` +
    S.chatMsgs.map(m => {
      const t = new Date(m.ts).toLocaleTimeString('ru', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
      const cls = m.dir === 'out' ? 'diag-out' : 'diag-in';
      const icon = m.dir === 'out' ? '→' : '←';
      return `<div class="diag-msg ${cls}">
        <span style="opacity:.5;font-size:10px;white-space:nowrap">${t} ${icon}</span>
        <span>${esc(m.text.slice(0,120))}${m.text.length>120?'…':''}</span>
      </div>`;
    }).join('');
}

// ── Chat message reading ─────────────────────────
function onChatMessage(d) {
  const text = String(d.text || '').trim();
  if (!text) return;
  S.chatMsgs.unshift({dir: d.direction, text, ts: Date.now()});
  if (S.chatMsgs.length > 20) S.chatMsgs.pop();

  if (d.direction === 'in') {
    if (/[әғқңөұүһі]/i.test(text) && S.lang !== 'kk')
      document.getElementById('kz-banner').style.display = '';
    // Check for "+" confirmation (stage 6)
    if (/^[+✓да]$/i.test(text.trim()) || /^(да|готово|ok|ок)$/i.test(text.trim())) {
      onConfirmationReceived(text);
    }
  }

  if (d.direction === 'out' && S.lastInsertedText && S.lang !== 'kk') {
    const key = S.lastInsertedText.slice(0, 30).toLowerCase();
    if (text.toLowerCase().includes(key)) {
      S.lastInsertedText = null;
    }
  }
}

function onConfirmationReceived(text) {
  if (S.activeStage !== 6) return;
  if (S.completedStages.has(6)) return;
  // Show completion hint in stage 6
  const stageEl = document.getElementById('stage-item-6');
  if (!stageEl) return;
  if (!stageEl.querySelector('.confirm-banner')) {
    const banner = document.createElement('div');
    banner.className = 'confirm-banner kz-banner';
    banner.style.margin = '6px 0';
    banner.innerHTML = `✅ Получено «+» — подтверждение пробного! <button class="small-btn brand" onclick="confirmTrialReceived()" style="margin-left:auto">Отметить</button>`;
    const body = stageEl.querySelector('.stage-body');
    if (body) body.insertBefore(banner, body.firstChild);
  }
}

function confirmTrialReceived() {
  if (!S.client) return;
  api('POST', '/api/scriptolog/confirm', {
    client_id: S.client.id,
    booking_date: S.vars['Дата'] || null,
    booking_time: S.vars['Время'] || null,
    confirmed_at: new Date().toISOString(),
  }).catch(() => {});
  completeStage(6);
}

// ── Send to extension ──────────────────────────
function sendToExtension(msg) {
  if (S.embedded) window.parent.postMessage(msg, '*');
}

// ── Log event ──────────────────────────────────
function logEvent(payload) {
  if (!S.client) return;
  const body = {client_id: S.client.id, ...payload};
  if (payload.status && payload.status !== S.client.status) {
    S.client = {...S.client, status: payload.status};
    renderClientCard();
  }
  api('POST', '/api/scriptolog/event', body).then(r => {
    if (r.ok) S.events.unshift({...body, created_at: new Date().toISOString()});
  }).catch(() => {});
}

// ── Phone binding ──────────────────────────────
function openBindDialog() {
  document.getElementById('bind-dialog').classList.add('open');
  document.getElementById('bind-input').value = '';
  document.getElementById('bind-err').textContent = '';
  document.getElementById('bind-input').focus();
}

function doBindPhone() {
  const phone = document.getElementById('bind-input').value.trim();
  const errEl = document.getElementById('bind-err');
  errEl.textContent = '';
  if (!phone) { errEl.textContent = 'Введите номер'; return; }
  api('POST', '/api/scriptolog/bind-phone', {client_id: S.client.id, phone})
    .then(r => {
      S.client = r.client;
      S.vars   = {...(r.client.vars||{})};
      renderClientCard();
      document.getElementById('bind-dialog').classList.remove('open');
    })
    .catch(e => { errEl.textContent = e.message; });
}

// ── Fact input dialog ───────────────────────────
let factDialogCb = null;
function openFactDialog(key, cb) {
  factDialogCb = cb;
  document.getElementById('fact-dialog-title').textContent = 'Введите: ' + key;
  document.getElementById('fact-input').value = '';
  document.getElementById('fact-dialog').classList.add('open');
  document.getElementById('fact-input').focus();
}
function doFactOk() {
  const val = document.getElementById('fact-input').value.trim();
  document.getElementById('fact-dialog').classList.remove('open');
  if (factDialogCb) { factDialogCb(val); factDialogCb = null; }
}

// ── Manager edit ───────────────────────────────
function openMgrDialog() {
  document.getElementById('mgr-input').value = S.manager;
  document.getElementById('mgr-dialog').classList.add('open');
  document.getElementById('mgr-input').focus();
}
function doMgrOk() {
  const val = document.getElementById('mgr-input').value.trim();
  S.manager = val;
  sessionStorage.setItem('sw_mgr', val);
  if (S.embedded) window.parent.postMessage({type:'manager-update', name: val}, '*');
  renderMgr();
  document.getElementById('mgr-dialog').classList.remove('open');
}

// ── Bind UI ────────────────────────────────────
function bindUI() {
  document.getElementById('l-btn').addEventListener('click', doLogin);
  document.getElementById('l-pw').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
  document.getElementById('l-login').addEventListener('keydown', e => { if(e.key==='Enter') { e.preventDefault(); document.getElementById('l-pw').focus(); }});
  document.getElementById('bind-phone-btn').addEventListener('click', openBindDialog);
  document.getElementById('mgr-edit-btn').addEventListener('click', openMgrDialog);
  document.getElementById('bind-ok').addEventListener('click', doBindPhone);
  document.getElementById('bind-cancel').addEventListener('click', () => document.getElementById('bind-dialog').classList.remove('open'));
  document.getElementById('bind-input').addEventListener('keydown', e => { if(e.key==='Enter') doBindPhone(); });
  document.getElementById('mgr-ok').addEventListener('click', doMgrOk);
  document.getElementById('mgr-cancel').addEventListener('click', () => document.getElementById('mgr-dialog').classList.remove('open'));
  document.getElementById('mgr-input').addEventListener('keydown', e => { if(e.key==='Enter') doMgrOk(); });
  document.getElementById('fact-ok').addEventListener('click', doFactOk);
  document.getElementById('fact-cancel').addEventListener('click', () => { document.getElementById('fact-dialog').classList.remove('open'); factDialogCb = null; });
  document.getElementById('fact-input').addEventListener('keydown', e => { if(e.key==='Enter') doFactOk(); });
}

boot();
</script>
